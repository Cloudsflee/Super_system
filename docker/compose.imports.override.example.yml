services:
  app:
    environment:
      AIWS_HOST_CODEX_HOME: /host/codex
      AIWS_HOST_CC_SWITCH_CONFIG_DIR: /host/cc-switch
      AIWS_HOST_PROJECTS_ROOT: /host/projects
    volumes:
      - type: bind
        source: /replace/with/codex-home
        target: /host/codex
        read_only: true
      - type: bind
        source: /replace/with/cc-switch
        target: /host/cc-switch
        read_only: true
      - type: bind
        source: /replace/with/projects-root
        target: /host/projects
        read_only: true

