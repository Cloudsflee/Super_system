services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiws
      POSTGRES_PASSWORD: aiws
      POSTGRES_DB: aiws
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiws"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
