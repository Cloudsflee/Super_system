name: aiws-v3

services:
  app:
    image: ${AIWS_APP_IMAGE:-aiws-app:3.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        AIWS_VERSION: 3.0.0
        AIWS_COMMIT: ${AIWS_COMMIT:-working-tree}
    init: true
    labels:
      aiws.owner: aiws-v3
      aiws.role: app
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    ports:
      - "127.0.0.1:${AIWS_PORT:-4317}:4317"
    environment:
      NODE_ENV: production
      AIWS_HOME: /var/lib/aiws
      AIWS_DOCKER_DATA_VOLUME: aiws-data-v3
      AIWS_BROKER_URL: http://runner-broker:4321
      AIWS_BROKER_MODE: http
      AIWS_RUNNER_DIGEST: ${AIWS_RUNNER_DIGEST:?set AIWS_RUNNER_DIGEST to the built Runner sha256 digest}
      AIWS_CODEX_SECRET_FILE: /run/secrets/codex_api_key
      AIWS_CODEX_MODEL: ${AIWS_CODEX_MODEL:-gpt-5.5}
      AIWS_GITHUB_SECRET_FILE: /run/secrets/github_token
      AIWS_GITHUB_REPOSITORY: ${AIWS_GITHUB_REPOSITORY:-}
      AIWS_GITHUB_FIXTURE_SHA: ${AIWS_GITHUB_FIXTURE_SHA:-}
    secrets:
      - broker_hmac
      - codex_api_key
      - github_token
    volumes:
      - type: volume
        source: aiws-data-v3
        target: /var/lib/aiws
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    networks:
      - internal
      - edge

  runner-broker:
    image: ${AIWS_BROKER_IMAGE:-aiws-runner-broker:3.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      target: broker
      args:
        AIWS_VERSION: 3.0.0
        AIWS_COMMIT: ${AIWS_COMMIT:-working-tree}
    init: true
    labels:
      aiws.owner: aiws-v3
      aiws.role: runner-broker
    restart: unless-stopped
    read_only: true
    expose:
      - "4321"
    environment:
      AIWS_BROKER_EXECUTOR: docker
      AIWS_BROKER_DATA_ROOT: /var/lib/aiws
      AIWS_DOCKER_DATA_VOLUME: aiws-data-v3
      AIWS_CODEX_MODEL: ${AIWS_CODEX_MODEL:-gpt-5.5}
      AIWS_RUNNER_DIGEST: ${AIWS_RUNNER_DIGEST:?set AIWS_RUNNER_DIGEST to the built Runner sha256 digest}
      AIWS_RUNNER_IMAGE: ${AIWS_RUNNER_IMAGE:?set AIWS_RUNNER_IMAGE to a digest-pinned Runner reference}
    secrets:
      - broker_hmac
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: volume
        source: aiws-data-v3
        target: /var/lib/aiws
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

networks:
  internal:
    internal: true
  edge:
    internal: false
  model:
    name: aiws-runner-model
    internal: false

volumes:
  aiws-data-v3:
    name: aiws-data-v3
    labels:
      aiws.owner: aiws-v3
      aiws.role: production-data
      aiws.schema: "1"

secrets:
  broker_hmac:
    file: ${AIWS_BROKER_SECRET_FILE:-./docker/secrets/broker_hmac}
  codex_api_key:
    file: ${AIWS_CODEX_SECRET_FILE:-./docker/secrets/codex_api_key}
  github_token:
    file: ${AIWS_GITHUB_SECRET_FILE:-./docker/secrets/github_token}
