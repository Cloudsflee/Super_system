name: aiws-v20

services:
  app:
    image: ${AIWS_APP_IMAGE:-aiws-app:2.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${AIWS_PORT:-4317}:4317"
    environment:
      NODE_ENV: production
      PORT: "4317"
      AIWS_BIND_HOST: "0.0.0.0"
      AIWS_HOME: /var/lib/aiws
      AIWS_CONTAINERIZED: "1"
      AIWS_DOCKER_DATA_VOLUME: ${AIWS_DOCKER_DATA_VOLUME:-aiws-data-v20}
      AIWS_DOCKER_INSTANCE: ${AIWS_DOCKER_INSTANCE:-aiws-v20}
      AIWS_CODEX_DOCKER_IMAGE: ${AIWS_RUNNER_IMAGE:-aiws-codex-runner:2.0.0-codex-0.144.0}
      AIWS_RUNNER_CPUS: ${AIWS_RUNNER_CPUS:-2}
      AIWS_RUNNER_MEMORY: ${AIWS_RUNNER_MEMORY:-4g}
      AIWS_RUNNER_PIDS: ${AIWS_RUNNER_PIDS:-512}
      AIWS_RUNNER_TMPFS: ${AIWS_RUNNER_TMPFS:-1g}
    volumes:
      - type: volume
        source: aiws-data
        target: /var/lib/aiws
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

volumes:
  aiws-data:
    name: ${AIWS_DOCKER_DATA_VOLUME:-aiws-data-v20}
    external: true
