name: V1.8 Controlled Live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v18-live:
    runs-on: [self-hosted, v18-live]
    environment: v18-live
    timeout-minutes: 95
    env:
      RUN_V18_MCP_LIVE_TESTS: '1'
      AIWS_TEST_CODEX_CONFIRM: dedicated-read-only
      AIWS_TEST_GITHUB_CONFIRM: dedicated-write-test
      AIWS_TEST_LIVE_BASE_URL: ${{ secrets.AIWS_TEST_LIVE_BASE_URL }}
      AIWS_TEST_MCP_TOKEN: ${{ secrets.AIWS_TEST_MCP_TOKEN }}
      AIWS_TEST_MCP_PROJECT_ID: ${{ secrets.AIWS_TEST_MCP_PROJECT_ID }}
      AIWS_TEST_MCP_GITHUB_TOKEN: ${{ secrets.AIWS_TEST_MCP_GITHUB_TOKEN }}
      AIWS_TEST_MCP_APPROVER_TOKEN: ${{ secrets.AIWS_TEST_MCP_APPROVER_TOKEN }}
      AIWS_TEST_MCP_RUN_ID: ${{ secrets.AIWS_TEST_MCP_RUN_ID }}
      AIWS_TEST_GITHUB_REPO: Cloudsflee/---
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:v18:live
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-live-${{ github.run_id }}
          path: .ai-workspace/test-reports/v1.8/
          if-no-files-found: error
          retention-days: 30
