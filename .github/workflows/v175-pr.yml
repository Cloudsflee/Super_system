name: V1.75 PR Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/v175-ci-impact.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v175-impact-${{ github.run_id }}
          path: .ai-workspace/test-reports/v1.75/
          if-no-files-found: error
          retention-days: 14

  v175-pr-linux:
    name: v175-pr-linux
    needs: impact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIWS_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:v175:pr
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v175-pr-linux-${{ github.run_id }}
          path: .ai-workspace/test-reports/v1.75/
          if-no-files-found: error
          retention-days: 14

  v175-pr-windows:
    name: v175-pr-windows
    needs: impact
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      AIWS_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:v175:pr
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v175-pr-windows-${{ github.run_id }}
          path: .ai-workspace/test-reports/v1.75/
          if-no-files-found: error
          retention-days: 14
