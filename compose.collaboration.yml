services:
  app:
    environment:
      AIWS_MCP_REMOTE_MODE: gateway
      AIWS_MCP_GATEWAY_SECRET_FILE: /run/secrets/aiws_mcp_gateway
      AIWS_PUBLIC_MCP_URL: ${AIWS_PUBLIC_MCP_URL:?set AIWS_PUBLIC_MCP_URL to the HTTPS team MCP endpoint}
      AIWS_INTERNAL_MCP_URL: http://mcp-gateway:4319/mcp
      AIWS_RUNNER_NETWORK: ${AIWS_MCP_AGENT_NETWORK:-aiws-v19-mcp-agents}
    secrets:
      - aiws_mcp_gateway
    networks:
      - default
      - mcp-core

  mcp-gateway:
    image: ${AIWS_MCP_GATEWAY_IMAGE:-aiws-mcp-gateway:1.10.0}
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-gateway
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AIWS_MCP_GATEWAY_PORT:-4319}:4319"
    environment:
      NODE_ENV: production
      AIWS_MCP_GATEWAY_HOST: 0.0.0.0
      AIWS_MCP_GATEWAY_PORT: "4319"
      AIWS_MCP_CORE_URL: http://app:4317/api/mcp
      AIWS_MCP_GATEWAY_SECRET_FILE: /run/secrets/aiws_mcp_gateway
      AIWS_MCP_GATEWAY_REQUIRE_PROXY_TLS: "1"
    secrets:
      - aiws_mcp_gateway
    networks:
      - mcp-core
      - mcp-agents
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

secrets:
  aiws_mcp_gateway:
    file: ${AIWS_MCP_GATEWAY_SECRET_FILE:?set AIWS_MCP_GATEWAY_SECRET_FILE to a 32-byte-or-longer secret file}

networks:
  mcp-core:
    internal: true
  mcp-agents:
    name: ${AIWS_MCP_AGENT_NETWORK:-aiws-v19-mcp-agents}
    attachable: true
